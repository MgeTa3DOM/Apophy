[project]
name = "apophy-finetune"
version = "0.1.0"
description = "QLoRA fine-tuning pipeline for Apophy — powered by UV + Unsloth"
requires-python = ">=3.11"
dependencies = [
    "unsloth>=2024.12",
    "transformers>=4.46",
    "datasets>=3.0",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.8",
]
