# Apophy Lab — Docker Compose (Proxmox LXC compatible)
# Usage: docker compose -f docker/docker-compose.yml up -d

services:
  apophy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: apophy-lab
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - apophy-data:/opt/apophy/data
    environment:
      - RUST_LOG=info
      - APOPHY_DB_PATH=/opt/apophy/data/memory.db
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  apophy-data:
    driver: local
